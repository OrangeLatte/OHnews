[project]
name = "oh-pipeline"
version = "0.1.0"
description = "OH!News 处理+统计层：实体 registry / 规则 Tagger / 分歧统计 / 验证门禁"
requires-python = ">=3.11"
dependencies = [
    "oh-contracts",
    "oh-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_pipeline"]
