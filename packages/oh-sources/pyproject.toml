[project]
name = "oh-sources"
version = "0.1.0"
description = "OH!News 采集层：SourceAdapter 框架 + 中文免费源 + GDELT/FRED 回填（裁决 C）"
requires-python = ">=3.11"
dependencies = [
    "oh-contracts",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_sources"]
