[project]
name = "oh-api"
version = "0.1.0"
description = "OH!News 服务层：FastAPI + SSE + 轻量 dashboard"
requires-python = ">=3.11"
dependencies = [
    "oh-agents",
    "oh-contracts",
    "oh-pipeline",
    "oh-storage",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_api"]
