[project]
name = "oh-storage"
version = "0.0.1"
description = "OH!News 存储层：Bronze parquet 分区 + Silver/Gold SQLite（WAL 单写者）+ 仓储协议"
requires-python = ">=3.11"
dependencies = [
    "oh-contracts",
    "pyarrow>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_storage"]
