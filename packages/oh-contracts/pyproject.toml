[project]
name = "oh-contracts"
version = "0.0.1"
description = "OH!News 共享契约：schema/枚举/常量（零内部依赖、零 IO）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_contracts"]
