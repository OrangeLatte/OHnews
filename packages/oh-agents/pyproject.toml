[project]
name = "oh-agents"
version = "0.1.0"
description = "OH!News Agent 层：analysis_graph（langgraph）+ LLM 补盲 + 晨报"
requires-python = ">=3.11"
dependencies = [
    "oh-contracts",
    "oh-llm",
    "oh-pipeline",
    "oh-storage",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2.11,<1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oh_agents"]
