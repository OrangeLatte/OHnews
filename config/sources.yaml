# OH!News 采集源注册表（Phase 1：中文 within-language + 宏观基线回填）
#
# 纪律（蓝图 §6 图3）：
# - credibility_prior 为信源先验（裁决 H SourcePrior 输入）
# - GDELT 仅覆盖度信号，不作 tone/frame（研究员/数据科学家共识）
# - rate_limit_rpm 令牌桶限速；needs_browser/paywall=true 的源走敏感壳（裁决 G）
# - URL 存活以首次真实运行验证为准；失败计入 source_fetch_logs → 自动降级
version: 1

sources:
  # ---- 2026-08-27 首次真实运行存活验证（详见 git log fix commit）----
  # 已淘汰（健康度台账留档）：people_politics（RSS 停更 15 个月）、
  # people_economy（404）、yicai/36kr（返回 HTML 假 feed，0 entries）、
  # jiemian/stcn/cnstock/gelonghui/china5e（404/403——主流中文媒体 RSS 生态已死）。
  # 中文源扩展路径：RSSHub 自建（Phase 6）或 API 型适配器（Phase 2）。

  # ---- L3 财经媒体（中文，市场化）——已验证 62 条/2d ----
  - source_id: wallstreetcn
    adapter: rss
    tier: L3
    language: zh
    credibility_prior: 0.75
    bias: financial_press
    rate_limit_rpm: 10
    params:
      url: "https://dedicated.wallstreetcn.com/rss.xml"

  # ---- GDELT（回填主通道；仅覆盖度信号；代理间歇可达→健康度自动处置）----
  - source_id: gdelt_zh
    adapter: gdelt
    tier: L2
    language: zh
    credibility_prior: 0.60
    bias: mixed_aggregate
    rate_limit_rpm: 6
    params:
      query: "sourcelang:chinese (央行 OR 货币政策 OR 利率 OR 中美 OR 关税)"
      max_records: 75

  # ---- FRED（宏观基线快照，L1 官方统计）----
  - source_id: fred_cpiaucsl
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    params: {series_id: CPIAUCSL}

  - source_id: fred_fedfunds
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    params: {series_id: FEDFUNDS}

  - source_id: fred_dgs10
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    params: {series_id: DGS10}

  - source_id: fred_unrate
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    params: {series_id: UNRATE}
