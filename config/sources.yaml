      detail:
        content_selector: "div#article"
        drop_selectors: ["div.article__controls", "div.alert"]
        max_items: 5

  # Fed Notes：央行研究长文（周更，货币市场/支付/银行风险主题，高框架密度）
  - source_id: feds_notes
    adapter: rss
