      url: "https://en.yna.co.kr/RSS/news.xml"

  - source_id: econ_times
    adapter: rss
    tier: L3
    language: en
    credibility_prior: 0.70
    bias: financial_press
    rate_limit_rpm: 6
    enabled: true
    params:
      url: "https://economictimes.indiatimes.com/rssfeedsdefault.cms"

  - source_id: livemint
    adapter: rss
    tier: L3
    language: en
    credibility_prior: 0.70
    bias: financial_press
    rate_limit_rpm: 6
    enabled: true
    params:
      url: "https://www.livemint.com/rss/news"

  # ---- L4 社媒/聚合 ----
  - source_id: hn_algolia
    adapter: json_api
    tier: L4
    language: en
    credibility_prior: 0.50
    bias: social_media
    rate_limit_rpm: 10
    enabled: true
    params:
      url: "https://hn.algolia.com/api/v1/search_by_date"
      params: {query: "federal reserve", tags: "story", hitsPerPage: "30"}
      items_path: "hits"
      external_id_path: "objectID"
      title_path: "title"
      body_path: "story_text"
      url_path: "url"
      published_path: "created_at"

  # ---- 登录门源（默认停用；用户导出 cookies 后改 enabled: true）----
  - source_id: reddit_cdp
    adapter: reddit_cdp
    tier: L4
    language: en
    credibility_prior: 0.40
    bias: social_media
    rate_limit_rpm: 10
    needs_browser: true
    enabled: false
    params:
      subreddits: [Economics, wallstreetbets, investing]
      limit: 25

  # ==================== 死源台账（2026-08-27 全球探测，留档防重复踩坑） ====================
  # scmp：直连 SSL EOF + 代理 ConnectError（双重失败）
  # imf：403 Access Denied（UA/地域双重拒绝）
  # boj：英文站无 RSS，HTML 列表 343KB（HtmlAdapter 候选，待 agent 维护 selector）
  # bundesbank/eurostat/bis：RSS 路径 404（需逐站重寻）
  # stats.gov.cn / csrc / treasury.gov / nyfed：列表页 JS 渲染，静态抓取 0 命中
  #   （Phase 6 playwright 壳接管；HtmlAdapter 机制已就绪+离线测试保底）
  # jin10 502；weibo 热搜 403（cookie 结构复杂待 CDP 扩展）；pbc.gov.cn WAF
  # people_politics（RSS 停更 15 个月）/people_economy(404)/yicai/36kr（HTML 假 feed）
  # jiemian/stcn/cnstock/gelonghui/china5e（404/403——主流中文媒体 RSS 生态已死）
  # AP 401；BLS 403；Reuters RSS 404；Nikkei 日文站 404（英文站已入）
