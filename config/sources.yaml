# OH!News 采集源注册表（Phase 1.5：全球主要经济体全覆盖）
#
# 纪律（蓝图 §6 图3）：
# - credibility_prior 为信源先验（裁决 H SourcePrior 输入）
# - GDELT 仅覆盖度信号，不作 tone/frame（研究员/数据科学家共识）
# - rate_limit_rpm 令牌桶限速；needs_browser/paywall=true 的源走敏感壳（裁决 G）
# - enabled=false 的源零开销（不建适配器、不调度、不发请求）——用户选择性激活
# - URL 存活以 2026-08-27 全球探测为准；失败计入 source_fetch_logs → 自动降级
version: 2

sources:
  # ==================== 中文（within-language Phase 1 主战场） ====================

  # ---- L3 财经媒体（市场化）----
  - source_id: wallstreetcn
    adapter: rss
    tier: L3
    language: zh
    credibility_prior: 0.75
    bias: financial_press
    rate_limit_rpm: 10
    enabled: true
    params:
      url: "https://dedicated.wallstreetcn.com/rss.xml"

  - source_id: wscn_lives
    adapter: json_api
    tier: L3
    language: zh
    credibility_prior: 0.75
    bias: financial_press
    rate_limit_rpm: 10
    enabled: true
    fallbacks: [sina_7x24, eastmoney_724]
    params:
      url: "https://api-one-wscn.awtmt.com/apiv1/content/lives"
      params: {channel: "global-channel", limit: "40"}
      items_path: "data.items"
      external_id_path: "display_time"
      title_path: "content_text"
      body_path: "content_text"
      published_path: "display_time"

  - source_id: sina_7x24
    adapter: json_api
    tier: L3
    language: zh
    credibility_prior: 0.70
    bias: financial_press
    rate_limit_rpm: 10
    enabled: true
    fallbacks: [eastmoney_724, wscn_lives]
    params:
      url: "https://zhibo.sina.com.cn/api/zhibo/feed"
      params: {page: "1", page_size: "40", zhibo_id: "152", tag_id: "0", dire: "f", dpc: "1"}
      items_path: "result.data.feed.list"
      external_id_path: "id"
      title_path: "rich_text"
      body_path: "rich_text"
      published_path: "create_time"
      date_formats: ["%Y-%m-%d %H:%M:%S"]
      tz_offset_hours: 8

  - source_id: eastmoney_724
    adapter: json_api
    tier: L3
    language: zh
    credibility_prior: 0.70
    bias: financial_press
    rate_limit_rpm: 10
    enabled: true
    fallbacks: [sina_7x24, wscn_lives]
    params:
      url: "https://np-listapi.eastmoney.com/comm/web/getFastNewsList"
      params: {client: "web", biz: "web_724", fastColumn: "102", sortEnd: "", pageSize: "40", req_trace: "{now_ms}"}
      items_path: "data.fastNewsList"
      external_id_path: "code"
      title_path: "title"
      body_path: "summary"
      published_path: "showTime"
      date_formats: ["%Y-%m-%d %H:%M:%S"]
      tz_offset_hours: 8

  # ---- L4 社媒（讨论度轴 D）----
  - source_id: zhihu_hotlist
    adapter: json_api
    tier: L4
    language: zh
    credibility_prior: 0.45
    bias: social_media
    rate_limit_rpm: 10
    enabled: true
    params:
      url: "https://api.zhihu.com/topstory/hot-list"
      params: {limit: "40"}
      items_path: "data"
      external_id_path: "target.id"
      title_path: "target.title"
      body_path: "target.excerpt"
      published_path: "target.created"
      url_template: "https://www.zhihu.com/question/{external_id}"
      article_type: opinion

  # ---- L1 官方（政策库检索 API）----
  # 2026-08-27 诊断：q=货币政策 最新 2022（国务院库不含央行文件）；q=金融 有 2025 条。
  # 回退方案：queries 多词轮询 + window_days=30（政策文档稀疏，1 天窗必 0 条）。
  - source_id: gov_policy
    adapter: json_api
    tier: L1
    language: zh
    credibility_prior: 0.95
    bias: state_media
    rate_limit_rpm: 6
    enabled: true
    params:
      url: "https://sousuo.www.gov.cn/search-gov/data"
      params: {t: "zhengcelibrary_gw", q: "货币政策", timetype: "timeqb", sort: "pubtime", sortType: "1", searchfield: "title", p: "1", n: "40"}
      queries: [货币政策, 利率, 金融, 财政, 央行]
      window_days: 30
      items_path: "searchVO.listVO"
      external_id_path: "id"
      title_path: "title"
      body_path: "summary"
      published_path: "ptime"

  # ---- L2 聚合（覆盖度信号）----
  # 2026-08-27：直连 SSL 握手超时；本机代理 127.0.0.1:9674 间歇可达。
  # 回退方案：直连失败 → 经 proxy_url 重试；仍败由 runner 退避 + 健康度自动降级。
  - source_id: gdelt_zh
    adapter: gdelt
    tier: L2
    language: zh
    credibility_prior: 0.60
    bias: mixed_aggregate
    rate_limit_rpm: 6
    enabled: true
    params:
      query: "sourcelang:chinese (央行 OR 货币政策 OR 利率 OR 中美 OR 关税)"
      max_records: 75
      proxy_url: "http://127.0.0.1:9674"
      proxy_fallback: true

  # 英文覆盖度回填（历史断代治理：7 月官方演讲稿需同日新闻凑事件门）
  - source_id: gdelt_en
    adapter: gdelt
    tier: L2
    language: en
    credibility_prior: 0.60
    bias: mixed_aggregate
    rate_limit_rpm: 6
    enabled: true
    params:
      query: >-
        sourcelang:english (central bank OR "monetary policy" OR "interest rate"
        OR "federal reserve" OR "bank of england" OR "european central bank" OR tariff)
      max_records: 250
      slice_days: 7
      proxy_url: "http://127.0.0.1:9674"
      proxy_fallback: true

  # ---- L1 官方统计（宏观基线快照）----
  - source_id: fred_cpiaucsl
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    enabled: true
    params: {series_id: CPIAUCSL}

  - source_id: fred_fedfunds
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    enabled: true
    params: {series_id: FEDFUNDS}

  - source_id: fred_dgs10
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    enabled: true
    params: {series_id: DGS10}

  - source_id: fred_unrate
    adapter: fred
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official_statistics
    rate_limit_rpm: 6
    enabled: true
    params: {series_id: UNRATE}

  # ==================== 英文/国际（Phase 6 within-language 预铺） ====================

  # ---- L1 央行/财政部/官方 ----
  - source_id: fed_press
    adapter: rss
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official
    rate_limit_rpm: 6
    enabled: true
    params:
      url: "https://www.federalreserve.gov/feeds/press_all.xml"

  # 央行演讲稿/证词（长文本高框架密度；官方簇 NDI 主粮，detail 抓全文）
  - source_id: fed_speeches
    adapter: rss
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official
    rate_limit_rpm: 6
    enabled: true
    params:
      url: "https://www.federalreserve.gov/feeds/speeches.xml"
      article_type: analysis
      window_days: 30
      detail:
        content_selector: "div#article"
        drop_selectors: ["div.article__controls", "div.alert"]
        max_items: 5

  - source_id: fed_testimony
    adapter: rss
    tier: L1
    language: en
    credibility_prior: 0.95
    bias: official
    rate_limit_rpm: 6
    enabled: true
