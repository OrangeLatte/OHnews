      article_type: analysis
      window_days: 30
      detail:
        content_selector: "div#content"   # FEDS Notes 新版站点结构（无 div#article）
        drop_selectors: ["nav", "div.t2__offcanvas", "div.article__controls"]
        max_items: 5

  - source_id: ecb_publications
    adapter: rss
