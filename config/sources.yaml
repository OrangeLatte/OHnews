    bias: official
    rate_limit_rpm: 6
    enabled: true
    params:
      list_url: "https://www.bankofengland.co.uk/speeches"
      item_selector: "a.release-speech"
      title_selector: "h3.list"
      date_selector: "time.release-date"
      date_attr: "datetime"          # ISO 日期（2026-07-21）
      window_days: 90                # 演讲稿低频（月 3-8 篇），窗口放大防 0 条
      wait_ms: 4000                  # BoE 列表 JS 渲染等待
      article_type: analysis
      detail:
        content_selector: "div#output"   # 渲染后正文容器（h2 Speech + p 段落）
        max_items: 5
        max_chars: 20000                 # 演讲稿全文（普通 8000 截断会砍半）

