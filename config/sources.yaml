    credibility_prior: 0.70
    bias: western_mainstream
    rate_limit_rpm: 6
    enabled: true
    params:
      url: "https://www.japantimes.co.jp/feed/"

  - source_id: yonhap_en
    adapter: rss
    tier: L2
