# OH!News 模型路由配置（裁决 E）。
# 契约：输出 schema 永不变，策略统一 function_calling；
# fallback 链顺序即优先级；候选失败（超时/限流/校验失败/密钥缺失）自动降级。
#
# 扩展新供应商：在 providers 下加条目（OpenAI 兼容 base_url + api_key_env），
# routing 中以 provider/model_id 引用。模型 ID 须与供应商 API 实际名称一致，
# 运行 `scripts/dev/annotate_gold.py --live` 失败时优先核对此项。
defaults:
  strategy: function_calling
  max_retries: 1
  # 并发护栏：Send 并行多事件共用 Router，全局信号量限制在途调用峰值，
  # 候选级退避重试（限流/超时），全部失败才降级下一候选。
  # 180s：glm-5.3-flash 十八元素拆解实测 ~100s，120s 贴边易间歇超时。
  timeout_s: 300
  max_concurrency: 3
  retry_attempts: 2
  retry_delay_s: 1.0

providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    # DeepSeek V4 默认思考模式不支持强制 tool_choice，结构化输出须关闭思考
    extra_body:
      thinking:
        type: disabled
    # DeepSeek V4 在 function_calling 下会把 schema 误认作真工具并乱起
    # tool_call name（OutputParserException: Unknown tool type），固定 json_mode
    strategy: json_mode
    models:
      deepseek-v4-flash:
        context_window: 128000
  zhipu:
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    # json_mode（prompt 注入 schema，无 bind/response_format）：实测 fc 在
    # glm-5.3-flash 上长输出挂起 >300s；bind(response_format) 触发服务端
    # 连接重置；prompt-only JSON 35s 稳定（2026-09-03 三路径对照）。
    strategy: json_mode
    models:
      glm-5.3:
        context_window: 200000
      glm-5.3-flash:
        context_window: 128000
  # openrouter 与任何 OpenAI 兼容端点按同样方式接入：
  # openrouter:
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
  #   models: {anthropic/claude-sonnet-4: {}}
  # ollama（本地）:
  #   base_url: http://localhost:11434/v1
  #   api_key_env: null
  #   models: {qwen2.5: {}}

routing:
  # io：批量读取/确定性输出/标注员 A
  io:
    primary: deepseek/deepseek-v4-flash
    fallback: [zhipu/glm-5.3-flash]
  # execute：常规分析/标注员 B
  # deepseek 优先：json_mode 拆解实测 4.7-31s 稳定；zhipu 对长中文正文
  # 双候选均 300s TimeoutError（2026-09-04 browser-e2e），降为兜底。
  execute:
    primary: deepseek/deepseek-v4-flash
    fallback: [zhipu/glm-5.3-flash]
  # strategic：最高复杂度/裁决员
  strategic:
    primary: zhipu/glm-5.3
    fallback: [zhipu/glm-5.3-flash, deepseek/deepseek-v4-flash]
